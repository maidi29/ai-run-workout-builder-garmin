<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Run Garmin — Feature Graphic (1024×500)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1024px;
        height: 500px;
        background: #0d1e35;
        font-family: "Montserrat", system-ui, sans-serif;
        color: #ffffff;
        overflow: hidden;
        position: relative;
      }

      /* Glow blobs */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        z-index: 0;
      }

      /* Left content */
      .content {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 460px;
        padding: 50px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 2;
      }

      .app-tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 5px 14px 5px 5px;
        border: 1.5px solid #4a7fc1;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #4a7fc1;
        margin-bottom: 22px;
        width: fit-content;
      }

      .title {
        font-size: 52px;
        font-weight: 900;
        line-height: 0.92;
        letter-spacing: -1.5px;
        margin-bottom: 16px;
        text-transform: uppercase;
      }
      .title .accent {
        color: #4a7fc1;
      }

      .tagline {
        font-size: 16px;
        font-weight: 500;
        color: #7a9abf;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .feature-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .feature-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #aabdd6;
      }
      .feature-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4a7fc1;
        flex-shrink: 0;
      }

      /* Right: phone previews */
      .phones-area {
        position: absolute;
        right: 20px;
        top: 0;
        bottom: 0;
        width: 580px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 18px;
        padding: 24px 28px 0;
        z-index: 2;
        overflow: hidden;
      }

      .mini-phone {
        border: 2.5px solid rgba(255, 255, 255, 0.75);
        border-radius: 22px;
        overflow: hidden;
        background: #f9f9f9;
        position: relative;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }
      .mini-phone.center {
        box-shadow: 6px 6px 0 #4a7fc1;
        transform: translateY(20px);
      }
      .mini-phone.left {
        box-shadow: 4px 4px 0 rgba(74, 127, 193, 0.5);
        transform: rotate(-6deg) translateY(36px);
      }
      .mini-phone.right {
        box-shadow: 4px 4px 0 rgba(74, 127, 193, 0.5);
        transform: rotate(6deg) translateY(36px);
      }

      /* Dynamic island + status bar */
      .mini-phone-top {
        background: #f9f9f9;
        padding: 6px 8px 4px;
        flex-shrink: 0;
      }
      .mini-island {
        width: 40px;
        height: 11px;
        background: #000;
        border-radius: 8px;
        margin: 0 auto 5px;
      }
      .mini-status {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mini-time {
        font-size: 7px;
        font-weight: 700;
        color: #1a1a1a;
      }
      .mini-battery {
        width: 13px;
        height: 6px;
        border: 1px solid #666;
        border-radius: 1.5px;
        position: relative;
      }
      .mini-battery::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 1px;
        bottom: 1px;
        width: 70%;
        background: #1a1a1a;
        border-radius: 1px;
      }

      /* Screenshot placeholder */
      .screenshot-placeholder {
        flex: 1;
        background: #e8edf5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-top: 1px solid #d0d0d0;
      }
      .placeholder-icon {
        width: 28px;
        height: 28px;
        opacity: 0.35;
      }
      .placeholder-label {
        font-size: 7px;
        font-weight: 600;
        color: #999;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: center;
        padding: 0 8px;
      }
    </style>
  </head>
  <body>
    <div
      class="blob"
      style="
        width: 500px;
        height: 500px;
        top: -160px;
        right: 30px;
        background: #1f487e;
        opacity: 0.22;
      "
    ></div>
    <div
      class="blob"
      style="
        width: 350px;
        height: 350px;
        bottom: -160px;
        left: -80px;
        background: #1f487e;
        opacity: 0.14;
      "
    ></div>

    <!-- LEFT: Text -->
    <div class="content">
      <div class="app-tag">
        <img
          src="../assets/icon-512.png"
          style="
            width: 22px;
            height: 22px;
            margin-left: 5px;
            border-radius: 5px;
            background: #fff;
            padding: 2px;
          "
        />
        AI Run Garmin
      </div>

      <div class="title">
        AI-POWERED<br />
        <span class="accent">GARMIN</span><br />
        WORKOUTS
      </div>

      <div class="tagline">
        From idea to watch in seconds —<br />powered by AI.
      </div>

      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-dot"></div>
          Describe your workout in plain language
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          Snap a photo of any training plan
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          Pick your mood &amp; let AI suggest a run
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          Review, edit &amp; push to Garmin Connect
        </div>
      </div>
    </div>

    <!-- RIGHT: Phone placeholders -->
    <div class="phones-area">
      <!-- Left phone -->
      <div class="mini-phone left" style="width: 142px; height: 296px">
        <img
          src="ressources/text.png"
          style="
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
          "
        />
      </div>

      <!-- Center phone -->
      <div
        class="mini-phone center"
        style="width: 172px; height: 352px; margin-bottom: -14px"
      >
        <img
          src="ressources/suggest.png"
          style="
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
          "
        />
      </div>

      <!-- Right phone -->
      <div class="mini-phone right" style="width: 142px; height: 296px">
        <img
          src="ressources/preview.png"
          style="
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block;
          "
        />
      </div>
    </div>
  </body>
</html>
